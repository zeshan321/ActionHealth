name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a new Spigot release that breaks an API call shows up without a code change.
    - cron: '0 6 * * 1'

jobs:
  build:
    # A fixed image, so a new Ubuntu version can not change the test servers without a commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew clean build

      - name: Cache spigot-api jars
        uses: actions/cache@v6
        with:
          path: compat/.cache
          key: spigot-api-${{ github.run_id }}
          restore-keys: spigot-api-

      - name: Check API linkage against every Spigot version
        run: compat/linkage-check.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ActionHealth
          path: build/libs/ActionHealth-*-all.jar

  # Starts real servers in Docker and checks the action bar with bots. See compat/e2e/ci.sh.
  e2e:
    needs: build
    # A fixed image, so a new Ubuntu version can not change the test servers without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ActionHealth
          path: build/libs

      # BuildTools takes several minutes for each Spigot version, so keep the jars.
      - name: Cache Spigot jars
        uses: actions/cache@v6
        with:
          path: compat/.cache/spigot/spigot-*.jar
          key: spigot-jars-1.8.8-1.21.11

      - name: Cache Paper, Folia and ViaVersion jars
        uses: actions/cache@v6
        with:
          path: |
            compat/.cache/plugins
            compat/.cache/via
          key: e2e-jars-${{ hashFiles('compat/e2e/ci.sh', 'compat/e2e/lib.sh') }}

      - name: Run the bot tests
        run: compat/e2e/ci.sh "$(ls build/libs/ActionHealth-*-all.jar)"

      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            compat/e2e/runs/*.log
            compat/e2e/runs/*/logs/latest.log
            compat/.cache/spigot/logs/*.log
