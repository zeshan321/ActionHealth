plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = 'com.zeshanaslam'
version = '3.8.1'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        // The public group, not only snapshots: spigot-api 1.8.8 needs bungeecord-chat 1.8-SNAPSHOT from it.
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
}

dependencies {
    // Compile against the oldest supported API (1.8.8). Anything newer must go through
    // feature detection, so one jar runs on every Spigot version from 1.8 to current.
    // Optional plugins (WorldGuard, PlaceholderAPI, MVdWPlaceholderAPI, MythicMobs, LangUtils)
    // are reached through reflection and need no compile dependency.
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    // bStats 3.1+ also runs on Folia.
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Java 8 bytecode runs on every Java version a Spigot server can use (8 to 25+).
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// The same source gives the same jar, so the checksum of a release matches the jar that CI tested.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

shadowJar {
    minimize()
    // bStats requires a relocation, so each plugin reports its own data.
    relocate 'org.bstats', 'com.zeshanaslam.actionhealth.libs.bstats'
}

tasks.build.dependsOn tasks.shadowJar
