plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = 'com.zeshanaslam'
version = '3.7.0'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'codemc-repo'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
}

dependencies {
    // Compile against the oldest supported API (1.8.8). Anything newer must go through
    // feature detection, so one jar runs on every Spigot version from 1.8 to current.
    // Optional plugins (PlaceholderAPI, MVdWPlaceholderAPI, MythicMobs, LangUtils) are
    // reached through reflection and need no compile dependency.
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    implementation 'org.codemc.worldguardwrapper:worldguardwrapper:1.2.1-SNAPSHOT'
}

// Java 8 bytecode runs on every Java version a Spigot server can use (8 to 25+).
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    minimize()
    relocate 'org.codemc.worldguardwrapper', 'com.zeshanaslam.actionhealth.libs.worldguardwrapper'
}

tasks.build.dependsOn tasks.shadowJar
